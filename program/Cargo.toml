[package]
name = "varswap-program"
description = "varswap on-chain program: realized-variance windows over canonical Pyth prints (Pinocchio, no_std)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "varswap_program"

[features]
default = ["events"]
# Log one event per accepted sample (docs/PLAN.md 3.1). `make bench` also builds without it
# to measure what the log costs.
events = ["dep:pinocchio-log"]

[dependencies]
bytemuck = { workspace = true }
pinocchio = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio-token = { workspace = true }
pinocchio-log = { workspace = true, optional = true }
pyth-lite = { workspace = true }
varswap-core = { workspace = true }
solana-address = { workspace = true, features = ["decode"] }

# On the host (clippy, rustdoc, tests), PDA derivation needs the curve25519 implementation; on
# SBF it is a syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { workspace = true, features = ["decode", "curve25519"] }

[dev-dependencies]
litesvm = { workspace = true }
litesvm-token = { workspace = true }
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }

[lints]
workspace = true
