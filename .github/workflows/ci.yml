# CI for varswap (docs/PLAN-improvements.md, milestone I1), ported from optfix milestone 9:
# `make pre-push` and `make bench` on pinned toolchains, so the committed docs/benchmarks.md
# is reproduced exactly.
#
# The jobs' union is exactly `make pre-push`: `checks` (everything but `test`) and `test`
# (`make program test`: the program tests load target/deploy/varswap_program.so). `bench`
# regenerates the CU table and requires the committed one.
#
# Pins (bump each in its own PR, with the bench table regenerated):
# - Agave CLI 4.4.0 release tarball, which bundles cargo-build-sbf 4.5.0;
# - platform-tools v1.57 (Rust 1.95.0 for SBF), installed from its verified archive;
# - host Rust 1.99.1 with rustfmt and clippy.
# SHA-256 values are the digests GitHub publishes for the release assets (the same as optfix).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The weekly long fuzz run (job `fuzz`, 30 minutes per target).
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_PIN: "1.99.1"
  AGAVE_VERSION: "v4.4.0"
  AGAVE_SHA256: "3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574"
  PLATFORM_TOOLS_VERSION: "v1.57"
  PLATFORM_TOOLS_SHA256: "b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00"
  CARGO_TERM_COLOR: never
  MAKE_PINS: RUST_TOOLCHAIN=1.99.1 CARGO_FLAGS=--locked
  # Fuzzing only (fuzz/, outside the workspace): pinned nightly and cargo-fuzz.
  FUZZ_TOOLCHAIN: "nightly-2026-10-29"
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: pre-push without test
        run: make $MAKE_PINS fmt-check lint lint-control sbf sbf-control doc
      - name: the CI jobs cover make pre-push
        run: |
          want="fmt-check lint lint-control sbf sbf-control test doc"
          got=$(sed -n 's/^pre-push: //p' Makefile)
          [ "$got" = "$want" ] || { echo "pre-push is '$got'; update this workflow's jobs"; exit 1; }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - run: make $MAKE_PINS program test

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - run: make $MAKE_PINS bench
      - name: docs/benchmarks.md is the committed one
        run: git diff --exit-code docs/benchmarks.md

  # The verifiable build (docs/verifiable.md, docs/PLAN-improvements.md I2): rebuilds the program
  # with solana-verify in the pinned image and requires the build hash docs/verifiable.md
  # records, so a program change must record its new hash in the same PR.
  verifiable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: solana-verify
        run: |
          cargo install --locked solana-verify --version 0.5.2
          solana-verify --version
      - name: Build hash is the recorded one
        run: make verifiable-check

  # Fuzz targets (docs/PLAN-improvements.md, I3): each target 120 s on pull requests and pushes,
  # 30 minutes on the weekly schedule, then the deterministic fault controls. A crash uploads
  # its input.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$FUZZ_TOOLCHAIN" install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
          cargo +"$FUZZ_TOOLCHAIN" fuzz --version
      - name: Fuzz every target
        run: |
          secs=120
          [ "${{ github.event_name }}" = schedule ] && secs=1800
          make $MAKE_PINS FUZZ_TOOLCHAIN="$FUZZ_TOOLCHAIN" FUZZ_SECONDS=$secs fuzz
      - name: Fault controls
        run: make FUZZ_TOOLCHAIN="$FUZZ_TOOLCHAIN" fuzz-control
      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
